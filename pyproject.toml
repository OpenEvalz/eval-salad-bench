[project]
name = "openevalz-eval-salad-bench"
version = "0.1.0"
description = "OpenEvalz packaging of SALAD-Bench: Hierarchical Safety Benchmark (Multiple-Choice)"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "salad-bench"
execution_class = "plain"
cost_class = "low"
